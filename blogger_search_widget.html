<!-- TABİRLY GELİŞMİŞ CANLI ARAMA WİDGET'I (8000+ YAZI UYUMLU)            -->
<!-- Yerleştirme: Blogger > Düzen > HTML/JavaScript Widget'ı ekle        -->
<!-- ==================================================================== -->

<div class="tabirly-search-container">
  <div class="tabirly-search-box">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="tabirlySearchInput" placeholder="8.000+ tabir ve başlık içinde arayın..." autocomplete="off">
    <button type="button" id="tabirlySearchClear" class="search-clear-btn" style="display:none;">&times;</button>
  </div>
  
  <!-- Arama Sonuçları Paneli -->
  <div id="tabirlySearchResults" class="tabirly-search-results" style="display:none;">
    <div class="search-header">
      <span id="searchStatusText">Sonuçlar</span>
    </div>
    <div id="searchResultsList" class="search-results-list"></div>
  </div>
</div>

<style>
  /* TABİRLY ARAMA WİDGET STİLLERİ */
  .tabirly-search-container {
    position: relative;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    font-family: 'Outfit', sans-serif;
    z-index: 9999;
  }

  .tabirly-search-box {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border: 2px solid #EAE5D9;
    border-radius: 12px;
    padding: 8px 16px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
  }

  .tabirly-search-box:focus-within {
    border-color: #C5A059;
    box-shadow: 0 4px 20px rgba(197, 160, 89, 0.25);
  }

  .tabirly-search-box .search-icon {
    color: #C5A059;
    font-size: 18px;
    margin-right: 12px;
  }

  .tabirly-search-box input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: #2A3B32;
    background: transparent;
    font-family: inherit;
  }

  .tabirly-search-box input::placeholder {
    color: #94a3b8;
  }

  .search-clear-btn {
    background: none;
    border: none;
    font-size: 22px;
    color: #94a3b8;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .search-clear-btn:hover {
    color: #2A3B32;
  }

  /* SONUÇ LİSTESİ */
  .tabirly-search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: #FFFFFF;
    border: 1px solid #EAE5D9;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    max-height: 480px;
    overflow-y: auto;
    animation: fadeIn 0.2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .search-header {
    padding: 10px 16px;
    background: #FDFBF7;
    border-bottom: 1px solid #EAE5D9;
    font-size: 13px;
    font-weight: 600;
    color: #5A6B62;
  }

  .search-results-list {
    padding: 6px 0;
  }

  .search-item {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    text-decoration: none;
    color: #2A3B32;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.2s ease;
  }

  .search-item:last-child {
    border-bottom: none;
  }

  .search-item:hover {
    background: #FDFBF7;
  }

  .search-item img {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    margin-right: 12px;
    background: #f1f5f9;
  }

  .search-item-info {
    flex: 1;
    overflow: hidden;
  }

  .search-item-title {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #2A3B32;
  }

  .search-item-title mark {
    background: rgba(197, 160, 89, 0.25);
    color: #2A3B32;
    font-weight: 700;
    border-radius: 2px;
    padding: 0 2px;
  }

  .search-item-cat {
    font-size: 12px;
    color: #C5A059;
    font-weight: 600;
    margin-top: 2px;
  }

  .search-no-results {
    padding: 20px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
  }
</style>

<script>
(function() {
  const INDEX_URL = "https://cdn.jsdelivr.net/gh/Tabirly/tabirly-data@main/search-index.json";
  let searchData = [];
  let isLoaded = false;
  let isLoading = false;

  const searchInput = document.getElementById("tabirlySearchInput");
  const clearBtn = document.getElementById("tabirlySearchClear");
  const resultsContainer = document.getElementById("tabirlySearchResults");
  const resultsList = document.getElementById("searchResultsList");
  const statusText = document.getElementById("searchStatusText");

  // Türkçe karakter normalleştirici
  function normalizeTR(text) {
    if (!text) return "";
    return text.toString().toLowerCase()
      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")
      .replace(/İ/g, "i")
      .replace(/I/g, "i");
  }

  // Veriyi Yükle
  async function loadSearchIndex() {
    if (isLoaded || isLoading) return;
    isLoading = true;
    try {
      const res = await fetch(INDEX_URL);
      searchData = await res.json();
      isLoaded = true;
      isLoading = false;
    } catch (err) {
      console.error("Arama verisi yüklenemedi:", err);
      isLoading = false;
    }
  }

  // Yazmaya başlayınca veya odaklanınca yükle
  searchInput.addEventListener("focus", loadSearchIndex);

  let debounceTimer;
  searchInput.addEventListener("input", function() {
    const query = this.value.trim();
    clearBtn.style.display = query ? "block" : "none";

    if (!query) {
      resultsContainer.style.display = "none";
      return;
    }

    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      performSearch(query);
    }, 150);
  });

  clearBtn.addEventListener("click", function() {
    searchInput.value = "";
    clearBtn.style.display = "none";
    resultsContainer.style.display = "none";
    searchInput.focus();
  });

  function performSearch(query) {
    if (!isLoaded) {
      resultsContainer.style.display = "block";
      resultsList.innerHTML = '<div class="search-no-results">Arama indeksi yükleniyor...</div>';
      loadSearchIndex().then(() => performSearch(query));
      return;
    }

    const normQuery = normalizeTR(query);
    const queryTokens = normQuery.split(/\s+/).filter(t => t.length > 0);

    const matches = [];
    for (let i = 0; i < searchData.length; i++) {
      const item = searchData[i];
      const normTitle = normalizeTR(item.t);

      // Tüm kelimeler başlıkta geçiyor mu?
      const isMatch = queryTokens.every(token => normTitle.includes(token));

      if (isMatch) {
        matches.push(item);
        if (matches.length >= 25) break; // Maksimum 25 sonuç göster
      }
    }

    renderResults(matches, query);
  }

  function renderResults(results, rawQuery) {
    resultsContainer.style.display = "block";
    statusText.textContent = results.length > 0 
      ? `${results.length} sonuç gösteriliyor` 
      : "Sonuç bulunamadı";

    if (results.length === 0) {
      resultsList.innerHTML = `<div class="search-no-results">"<b>${escapeHTML(rawQuery)}</b>" ile ilgili sonuç bulunamadı.</div>`;
      return;
    }

    const regex = new RegExp(`(${rawQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

    let html = "";
    results.forEach(item => {
      const imgTag = item.i ? `<img src="${item.i}" alt="${escapeHTML(item.t)}" loading="lazy">` : `<div style="width:44px;height:44px;background:#f1f5f9;border-radius:8px;margin-right:12px;"></div>`;
      const categoryTag = item.c ? `<div class="search-item-cat">${escapeHTML(item.c)}</div>` : "";
      
      const highlightedTitle = escapeHTML(item.t).replace(regex, '<mark>$1</mark>');

      html += `
        <a href="${item.u}" class="search-item">
          ${imgTag}
          <div class="search-item-info">
            <div class="search-item-title">${highlightedTitle}</div>
            ${categoryTag}
          </div>
        </a>
      `;
    });

    resultsList.innerHTML = html;
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // Dışarı tıklandığında sonuçları kapat
  document.addEventListener("click", function(e) {
    if (!e.target.closest(".tabirly-search-container")) {
      resultsContainer.style.display = "none";
    }
  });
})();
</script>
